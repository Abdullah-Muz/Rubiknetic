[project]
name = "rubiknetic"
version = "0.0.0"
description = "Contact-driven bimanual Rubik's Cube manipulation research in MuJoCo"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco==4.0.1",
    "numpy==2.5.4",
    "scipy==1.18.1",
]

[dependency-groups]
dev = ["pytest==9.2.0"]
rl = [
    "stable-baselines3==2.9.2",
    "gymnasium==1.4.0",
    "torch==2.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rubiknetic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
