# Continuous integration: run the unit/smoke test suite on a clean clone.
#
# Scope: tests only (pytest, testpaths = ["tests"]). Experiment scripts under
# experiments/ are never run here; they take minutes to hours and are run and
# recorded deliberately, not on every push. CPU-only by design (D-11): no CUDA,
# no GPU, no rendering.
#
# Pinning: every action is pinned to a full commit SHA (release tag in the
# trailing comment); the uv binary and Python minor version are pinned too.
# Dependencies come from the committed uv.lock; `--locked` makes the job fail
# if uv.lock is out of date with pyproject.toml instead of silently re-resolving.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (Python 3.12, CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # full history: the scored-run resume tests resolve earlier commits by hash (git rev-parse <sha>)
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          python-version: "3.12"
          enable-cache: true

      # The virtualenv lives outside the checkout: the G2 frozen-path tests treat every file under the repository root
      # as project code. (runner.temp is available in step-level env only, so it is repeated per step.)
      - name: Install locked dependencies
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/venv
        run: uv sync --locked

      # Two pytest processes (2026-11-28 CI diagnosis): loading the G2 trials re-executes experiments/E7_scored_m7/run.py
      # through D16 grip_probe.load_e7 and re-patches the shared M7/M5 runner modules (seed map, frozen-path list), which
      # breaks the G1 runner tests when both run in one process. Those modules are frozen (G1 and G2), so the tests are
      # separated instead.
      #
      # Not run on CI (git-ignored inputs; they run locally before any freeze or scored run):
      # - tests/test_scored_m7.py::test_counts needs the near-field tables (experiments/D8_alignment/results/tables/);
      # - the four G2 scene tests need third_party_cad/ (GrabCAD terms); they skip themselves when it is absent.
      - name: Run tests (all but G2)
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/venv
        run: >-
          uv run --locked pytest --ignore=tests/test_scored_g2.py
          --deselect tests/test_scored_m7.py::test_counts

      - name: Run tests (G2, own process)
        if: success() || failure()
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/venv
        run: uv run --locked pytest -rs tests/test_scored_g2.py
